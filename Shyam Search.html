<script>
  async function doSearch() {
    const q = (document.getElementById('homeInput').value || document.getElementById('resultsInput').value).trim();
    if (!q) return;

    document.getElementById('home-page').style.display = 'none';
    document.getElementById('results-page').style.display = 'block';
    document.getElementById('resultsInput').value = q;
    document.getElementById('homeInput').value = q;

    const list = document.getElementById('resultsList');
    const stats = document.getElementById('resultsStats');

    list.innerHTML = `<div class="loading"><div class="spinner"></div> Results dhundh rahe hain...</div>`;
    stats.textContent = '';

    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: `You are a search engine. When given a search query, return exactly 6 real search results in JSON only (no markdown, no explanation).
Format: [{"title":"...","url":"https://...","displayUrl":"...","desc":"..."}]
Rules:
- Use REAL websites with real URLs that actually exist and work (e.g. https://www.youtube.com, https://en.wikipedia.org/wiki/..., etc.)
- desc should be 1-2 sentences describing the page
- displayUrl is the short domain shown (e.g. www.youtube.com)
- Return ONLY the JSON array, nothing else`,
          messages: [{ role: "user", content: `Search query: ${q}` }]
        })
      });
      const data = await res.json();
      const text = data.content.map(i => i.text || "").join("");
      const clean = text.replace(/```json|```/g, "").trim();
      const results = JSON.parse(clean);

      const count = Math.floor(Math.random() * 90000000) + 10000000;
      const time = (Math.random() * 0.4 + 0.3).toFixed(2);
      stats.textContent = `Lagbhag ${count.toLocaleString('hi-IN')} results (${time} seconds)`;

      list.innerHTML = results.map(r => `
        <div class="result-item">
          <div class="result-url">
            <span class="result-favicon">🌐</span>
            ${r.displayUrl}
          </div>
          <a class="result-title" href="${r.url}" target="_blank" rel="noopener">${r.title}</a>
          <div class="result-desc">${r.desc}</div>
        </div>
      `).join('');
    } catch(e) {
      list.innerHTML = `<div style="color:#EA4335;padding:1rem;">⚠️ Search nahi ho paya. Dobara try karein.</div>`;
    }

  }

  function feelingLucky() {
    const queries = ['Shyam Search kya hai', 'India cricket', 'Biryani recipe', 'Bollywood songs', 'Weather today'];
    document.getElementById('homeInput').value = queries[Math.floor(Math.random() * queries.length)];
    doSearch();
  }

  function goHome() {
    document.getElementById('results-page').style.display = 'none';
    document.getElementById('home-page').style.display = 'flex';
    document.getElementById('homeInput').value = '';
    document.getElementById('resultsInput').value = '';
    document.getElementById('resultsList').innerHTML = '';
    document.getElementById('resultsStats').textContent = '';
  }
</script>
